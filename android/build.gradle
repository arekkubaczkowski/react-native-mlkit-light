plugins {
  id 'com.android.library'                                                                                              
  id 'expo-module-gradle-plugin'
}                                                                                                                       
                                                                                                                      
group = 'expo.modules.mlkitlight'
version = '0.1.0'

android {
  namespace "expo.modules.mlkitlight"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
